name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway-and-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm --prefix gateway ci
      - run: node --check src/pkjs/index.js
      - run: node --check gateway/src/beeper-client.js
      - run: node --check gateway/src/server.js
      - run: npm test
  mac-connector:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -framework AppKit -framework Security -typecheck mac/BeepsterConnector.swift
      - run: plutil -lint mac/BeepsterConnector-Info.plist mac/BeepsterContacts-Info.plist
