name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway-and-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/pkjs/index.js
      - run: node --check gateway/src/beeper-client.js
      - run: node --check gateway/src/server.js
      - run: npm test
