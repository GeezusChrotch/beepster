name: Bug report
description: Report a reproducible Beepster problem without private message data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, pairing codes, private hostnames, contacts, or unredacted messages."
  - type: input
    id: version
    attributes:
      label: Beepster version
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Pebble firmware, phone OS, Beeper Desktop version, and messaging service.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private messages, contacts, identifiers, tokens, hostnames, and pairing codes.
          required: true
